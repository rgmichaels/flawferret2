name: Publish API docs

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/job-schemas/**"
      - "packages/db/**"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Satisfies config/schema validation in `prisma generate` and the API's
      # own env schema. Nothing in this workflow opens a database
      # connection — the OpenAPI document is rendered from route schemas.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @flawferret2/db db:generate

      - name: Generate OpenAPI document
        run: pnpm --filter @flawferret2/api docs:openapi

      - name: Render static docs site
        run: |
          mkdir -p site
          pnpm --package=@redocly/cli dlx redocly build-docs apps/api/openapi.json --output site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
